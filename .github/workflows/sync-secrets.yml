name: Sync Actions secrets

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview changes without writing secrets
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: secret-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Actions secrets
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create secret-sync App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.SECRET_SYNC_APP_ID }}
          private-key: ${{ secrets.SECRET_SYNC_APP_PRIVATE_KEY }}
          owner: michidk

      # Reads the target repositories' workflow files, which the secret-sync App may not.
      - name: Create Orcastrate App token
        id: orcastrate-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.ORCASTRATE_APP_ID }}
          private-key: ${{ secrets.ORCASTRATE_PRIVATE_KEY }}
          owner: michidk

      # Targets are the repositories the secret-sync App is installed on whose workflows use
      # the release App. Their names stay out of this public repository and its logs.
      - name: Select repositories that use the release App
        id: repos
        env:
          RELEASER_APP_ID: ${{ vars.RELEASER_APP_ID }}
          RELEASER_APP_PRIVATE_KEY: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          SYNC_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.orcastrate-token.outputs.token }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASER_APP_ID" || -z "$RELEASER_APP_PRIVATE_KEY" ]]; then
            echo '::error::The workflows repository is missing the release App credentials.'
            exit 1
          fi
          uses_releaser() {
            local files file
            files="$(gh api "repos/$1/contents/.github/workflows" \
              --jq '.[] | select(.type == "file") | .path')" || return 1
            while read -r file; do
              [[ -n "$file" ]] || continue
              if grep -q 'RELEASER_APP_' <<< "$(gh api -H 'Accept: application/vnd.github.raw' "repos/$1/contents/$file")"; then
                return 0
              fi
            done <<< "$files"
            return 1
          }
          candidates="$(GH_TOKEN="$SYNC_TOKEN" scripts/installation-repos.sh)"
          repos=""
          while read -r repo; do
            [[ -n "$repo" ]] || continue
            if uses_releaser "$repo"; then repos+="$repo"$'\n'; fi
          done <<< "$candidates"
          echo "$(grep -c . <<< "$candidates" || true) repositories have the secret-sync App, $(grep -c . <<< "$repos" || true) use the release App."
          if [[ -z "$repos" ]]; then
            echo '::error::No repository with the secret-sync App uses the release App.'
            exit 1
          fi
          { echo 'list<<EOF'; printf '%s' "$repos"; echo EOF; } >> "$GITHUB_OUTPUT"

      - name: Distribute release App credentials
        uses: jpoehnelt/secrets-sync-action@7840777f242539d96b60477b66aa1c179e7644ea # master
        env:
          RELEASER_APP_ID: ${{ vars.RELEASER_APP_ID }}
          RELEASER_APP_PRIVATE_KEY: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          repositories_list_regex: "false"
          # Newline-separated owner/name list, masked by the previous step.
          repositories: ${{ steps.repos.outputs.list }}
          secrets: |
            ^RELEASER_APP_ID$
            ^RELEASER_APP_PRIVATE_KEY$
          dry_run: ${{ inputs.dry_run }}
