name: Sync Actions secrets

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview changes without writing secrets
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: secret-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Actions secrets
    runs-on: ubuntu-26.04
    steps:
      - name: Create secret-sync App token
        id: app-token
        uses: actions/create-github-app-token@0f859bf9e69e887678d5bbfbee594437cb440ffe # v2.1.0
        with:
          app-id: ${{ vars.SECRET_SYNC_APP_ID }}
          private-key: ${{ secrets.SECRET_SYNC_APP_PRIVATE_KEY }}
          owner: michidk
          repositories: |
            bitmap2ttf
            brewscale-rs
            cyrus
            displayz
            liftosaur2garmin
            off-rs
            redguard-preservation
            vscli
            wslpath2

      - name: Sync RELEASE_PAT
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [[ -z "$RELEASE_PAT" ]]; then
            echo '::error::The workflows repository is missing the RELEASE_PAT secret.'
            exit 1
          fi

      - name: Distribute RELEASE_PAT
        uses: jpoehnelt/secrets-sync-action@7840777f242539d96b60477b66aa1c179e7644ea # master
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          repositories_list_regex: "false"
          repositories: |
            michidk/bitmap2ttf
            michidk/brewscale-rs
            michidk/cyrus
            michidk/displayz
            michidk/liftosaur2garmin
            michidk/off-rs
            michidk/redguard-preservation
            michidk/vscli
            michidk/wslpath2
          secrets: |
            ^RELEASE_PAT$
          dry_run: ${{ inputs.dry_run }}
