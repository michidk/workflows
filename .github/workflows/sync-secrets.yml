name: Sync Actions secrets

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview changes without writing secrets
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: secret-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Actions secrets
    runs-on: ubuntu-26.04
    steps:
      - name: Create secret-sync App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SECRET_SYNC_APP_ID }}
          private-key: ${{ secrets.SECRET_SYNC_APP_PRIVATE_KEY }}
          owner: michidk

      - name: Validate release App credentials
        env:
          RELEASER_APP_ID: ${{ vars.RELEASER_APP_ID }}
          RELEASER_APP_PRIVATE_KEY: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          SECRET_SYNC_REPOS: ${{ secrets.SECRET_SYNC_REPOS }}
        run: |
          if [[ -z "$SECRET_SYNC_REPOS" ]]; then
            echo '::error::The SECRET_SYNC_REPOS repository secret is empty.'
            exit 1
          fi
          if [[ -z "$RELEASER_APP_ID" || -z "$RELEASER_APP_PRIVATE_KEY" ]]; then
            echo '::error::The workflows repository is missing the Releaser App credentials.'
            exit 1
          fi

      - name: Distribute release App credentials
        uses: jpoehnelt/secrets-sync-action@7840777f242539d96b60477b66aa1c179e7644ea # master
        env:
          RELEASER_APP_ID: ${{ vars.RELEASER_APP_ID }}
          RELEASER_APP_PRIVATE_KEY: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          repositories_list_regex: "false"
          # Newline-separated owner/name list; a secret keeps private repository names out of logs.
          repositories: ${{ secrets.SECRET_SYNC_REPOS }}
          secrets: |
            ^RELEASER_APP_ID$
            ^RELEASER_APP_PRIVATE_KEY$
          dry_run: ${{ inputs.dry_run }}
