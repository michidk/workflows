name: Sync workflows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orcastrate-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync managed workflows
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create Orcastrate App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.ORCASTRATE_APP_ID }}
          private-key: ${{ secrets.ORCASTRATE_PRIVATE_KEY }}
          owner: michidk
          repositories: |
            redguard-preservation
            vscli
            bitmap2ttf
            displayz
            off-rs
            wslpath2
            cyrus
            hodor
            shimesu
            fitsim
            shottimer
            rost
            tcplex
            brewscale-rs
            divecalc
            icecheck
            liftosaur2garmin
            CodeTend
            brewscale-web
            divetracx
            miseshare
            roastbook
            roastbook-cloud
            roastbook-infra
            frndbook
            shadcn-3d-viewer
            sticks-and-clay

      - name: Run Orcastrate
        uses: michidk/orcastrate@2be0c85998bacb0649a3549c07fbcb2230d446c3 # main
        with:
          orcastrate-token: ${{ steps.app-token.outputs.token }}
          github-token: ${{ steps.app-token.outputs.token }}
