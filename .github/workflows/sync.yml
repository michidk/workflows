name: Sync workflows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orcastrate-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync managed workflows (${{ matrix.owner }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        owner: [michidk, frndbook-dev]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create Orcastrate App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.ORCASTRATE_APP_ID }}
          private-key: ${{ secrets.ORCASTRATE_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}

      # The managed repositories are the ones the App is installed on. Their names never
      # appear in this public repository or its logs: the script masks each one.
      - name: Build Orcastrate config from the App installation
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ matrix.owner }}
        run: |
          set -euo pipefail
          repos="$(scripts/installation-repos.sh)"
          if [[ -z "$repos" ]]; then
            echo "::error::The Orcastrate App can access no repositories of $OWNER."
            exit 1
          fi
          {
            cat orchestrator.toml
            while read -r repo; do printf '\n[[repos]]\nname = "%s"\n' "$repo"; done <<< "$repos"
          } > .orcastrate.toml

      - name: Run Orcastrate
        uses: michidk/orcastrate@230417d08da91f4c196e95e65d1ec82e5b08975b # main
        with:
          config: .orcastrate.toml
          orcastrate-token: ${{ steps.app-token.outputs.token }}
          github-token: ${{ steps.app-token.outputs.token }}
