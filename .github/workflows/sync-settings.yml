name: Sync repository settings (prototype)

on:
  workflow_dispatch:
    inputs:
      command:
        description: Preview drift or apply the shared settings
        type: choice
        options: [plan, sync]
        default: plan
        required: true
      repository:
        description: Orcastrate owner/repo, or empty for all managed repositories
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: repository-settings
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - name: Read Orcastrate inventory
        id: targets
        env:
          REPOSITORY: ${{ inputs.repository }}
        run: |
          matrix=$(python3 scripts/settings-matrix.py --repository "$REPOSITORY")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  settings:
    needs: inventory
    name: ${{ inputs.command }} ${{ matrix.repository }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create repository-scoped Orcastrate App token
        id: app-token
        uses: actions/create-github-app-token@0f859bf9e69e887678d5bbfbee594437cb440ffe # v2.1.0
        with:
          app-id: ${{ vars.ORCASTRATE_APP_ID }}
          private-key: ${{ secrets.ORCASTRATE_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.name }}
          permission-administration: write
      - name: Plan or apply common settings
        uses: noirbizarre/gh-settings@365d8c23069dc1bcb33c1c96ce156a44845bac81 # 0.3.0
        with:
          version: '0.3.0'
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ matrix.repository }}
          config: settings/common.yml
          command: ${{ inputs.command }}
          prune: 'false'
