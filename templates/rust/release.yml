{% set library_only = library_only | default(value=false) -%}
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag; omit when running on a tag
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ "{{ github.repository }}" }}-${{ "{{ inputs.tag || github.ref_name }}" }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
{% if not library_only and build_workflow is not defined %}
  BIN_NAME: {{ bin_name }}
{% endif %}
  TAG_NAME: ${{ "{{ inputs.tag || github.ref_name }}" }}
  PUBLISH_RELEASE: "{{ publish_release | default(value=false) }}"

jobs:
  verify:
    name: Verify release
    runs-on: {% if custom_runner is defined %}{{ custom_runner }}{% else %}{{ runner_os | default(value="ubuntu-26.04") }}{% endif %}
    timeout-minutes: 20
    steps:
      - name: Validate release tag and publishing token
        run: |
          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Select a stable vX.Y.Z release tag.'
            exit 1
          fi

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ "{{ env.TAG_NAME }}" }}
          persist-credentials: false

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Verify Cargo version matches tag
        run: |
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
{% for manifest in manifest_paths | default(value=["Cargo.toml"]) %}
          version="$(jq -er --arg manifest '{{ manifest }}' \
            '.packages[] | select((.manifest_path | gsub("\\\\"; "/")) == ((env.GITHUB_WORKSPACE | gsub("\\\\"; "/")) + "/" + $manifest)) | .version' <<< "$metadata")"
          if [[ "$version" != "${TAG_NAME#v}" ]]; then
            printf '::error::Cargo version %s does not match tag %s.\n' "$version" "$TAG_NAME"
            exit 1
          fi
{% endfor %}

{% if build_workflow is not defined %}
      - name: Format, lint, and test
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features

{% endif %}
{% if build_workflow is defined %}
  build:
    name: Build and verify release artifacts
    needs: verify
    uses: {{ build_workflow }}
    with:
      tag: ${{ "{{ inputs.tag || github.ref_name }}" }}
{% elif not library_only %}
  build:
    name: Build (${{ "{{ matrix.target }}" }})
    needs: verify
    runs-on: {% if custom_runner is defined %}{{ custom_runner }}{% else %}${{ "{{ matrix.os }}" }}{% endif %}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
{% for build in targets %}
          - os: {{ build.os }}
            target: {{ build.target }}
            cross: {{ build.cross | default(value=false) }}
            lib_file: "{{ build.lib_file | default(value="") }}"
{% endfor %}
    env:
      TARGET: ${{ "{{ matrix.target }}" }}
      LIB_FILE: ${{ "{{ matrix.lib_file }}" }}
      BUILD_TOOL: cargo
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
      CROSS_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_IMAGE: ghcr.io/cross-rs/arm-unknown-linux-gnueabihf:0.2.5
      CROSS_TARGET_X86_64_UNKNOWN_LINUX_MUSL_IMAGE: ghcr.io/cross-rs/x86_64-unknown-linux-musl:0.2.5
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ "{{ env.TAG_NAME }}" }}
          persist-credentials: false

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ "{{ matrix.target }}" }}

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ "{{ matrix.target }}" }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cross@0.2.5

      - name: Select cross compiler
        if: matrix.cross
        run: echo 'BUILD_TOOL=cross' >> "$GITHUB_ENV"

      - name: Build release
        run: '"$BUILD_TOOL" build --release --locked --target "$TARGET"'

      - name: Package archives
        run: |
          archive() {
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              7z a "dist/$1.zip" "$1"
            else
              tar -czf "dist/$1.tar.gz" "$1"
            fi
          }
          cli_dir="$BIN_NAME-$TARGET"
          binary="$BIN_NAME"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
          mkdir -p dist "$cli_dir"
          cp "target/$TARGET/release/$binary" "$cli_dir/"
          archive "$cli_dir"
          if [[ -n "$LIB_FILE" ]]; then
            lib_dir="lib$BIN_NAME-$TARGET"
            mkdir -p "$lib_dir"
            cp "target/$TARGET/release/$LIB_FILE" "$lib_dir/"
            archive "$lib_dir"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ "{{ matrix.target }}" }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

{% endif %}
  release:
    name: Create GitHub release
    needs: {% if library_only and build_workflow is not defined %}verify{% else %}build{% endif %}
    runs-on: {% if custom_runner is defined %}{{ custom_runner }}{% else %}ubuntu-26.04{% endif %}
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ "{{ github.repository }}" }}
    steps:
      - name: Create release App token
        id: release-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ "{{ secrets.RELEASER_APP_ID }}" }}
          private-key: ${{ "{{ secrets.RELEASER_APP_PRIVATE_KEY }}" }}
          owner: ${{ "{{ github.repository_owner }}" }}
          repositories: ${{ "{{ github.event.repository.name }}" }}

      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ "{{ env.TAG_NAME }}" }}
          persist-credentials: false

      - name: Generate release changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --current --strip header --output CHANGELOG.md

{% if not library_only or build_workflow is defined %}
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum -- * > SHA256SUMS
{% endif %}

      - name: Create or update draft, then publish if enabled
        env:
          # Publishing with GITHUB_TOKEN would suppress release-triggered workflows.
          GH_TOKEN: ${{ "{{ env.PUBLISH_RELEASE == 'true' && steps.release-token.outputs.token || github.token }}" }}
        run: |
          release_state="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
            jq -r --arg tag "$TAG_NAME" '.[] | select(.tag_name == $tag) | .draft')"
          if [[ "$release_state" == "false" ]]; then
            echo 'Release is already published; leaving it unchanged.'
            exit 0
          fi
          if [[ "$release_state" == "true" ]]; then
{% if not library_only or build_workflow is defined %}
            gh release upload "$TAG_NAME" artifacts/* --clobber
{% endif %}
            gh release edit "$TAG_NAME" --notes-file CHANGELOG.md
          else
            gh release create "$TAG_NAME"{% if not library_only or build_workflow is defined %} artifacts/*{% endif %} --verify-tag --draft \
              --title "${TAG_NAME#v}" --notes-file CHANGELOG.md
          fi
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            gh release edit "$TAG_NAME" --draft=false
          fi

  completion:
    name: Release complete
    if: always()
    needs: [verify, {% if not library_only or build_workflow is defined %}build, {% endif %}release]
    runs-on: {% if custom_runner is defined %}{{ custom_runner }}{% else %}ubuntu-26.04{% endif %}
    timeout-minutes: 5
    env:
      RESULTS: ${{ "{{ toJSON(needs) }}" }}
    steps:
      - name: Require every release job to succeed
        run: |
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          if ! jq -e 'all(.[]; .result == "success")' <<< "$RESULTS" > /dev/null; then
            echo '::error::Release incomplete. Verification, builds and publication must succeed.'
            exit 1
          fi
