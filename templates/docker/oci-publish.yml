name: Publish OCI image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: {{ registry | default(value="ghcr.io") }}
  IMAGE_NAME: ${{ "{{ github.repository }}" }}

jobs:
  publish:
    name: Build and publish image
    runs-on: {{ runner_os | default(value="ubuntu-24.04") }}
    timeout-minutes: {{ timeout_minutes | default(value=30) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ "{{ env.REGISTRY }}" }}
          username: ${{ "{{ github.actor }}" }}
          password: ${{ "{{ secrets.GITHUB_TOKEN }}" }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a141130b1 # v6
        with:
          images: ${{ "{{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: {{ context | default(value=".") }}
          file: {{ dockerfile | default(value="Dockerfile") }}
          platforms: {{ platforms | default(value="linux/amd64,linux/arm64") }}
          push: true
          tags: ${{ "{{ steps.meta.outputs.tags }}" }}
          labels: ${{ "{{ steps.meta.outputs.labels }}" }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
