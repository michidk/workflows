name: Test & Verify

on: [push, pull_request]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test Suite
    runs-on: {% if custom_runner is defined %}{{ custom_runner }}{% else %}{{ runner_os | default(value="ubuntu-24.04") }}{% endif %}
    timeout-minutes: {{ timeout_minutes | default(value=20) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: {{ uv_version | default(value="latest") }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Test
        run: {{ test_command | default(value="uv run pytest -q") }}
{% if lint_command | default(value="") != "" %}
      - name: Lint
        run: {{ lint_command }}
{% endif %}
{% if typecheck_command | default(value="") != "" %}
      - name: Type check
        run: {{ typecheck_command }}
{% endif %}
{% if hadolint | default(value=false) %}
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: {{ dockerfile | default(value="Dockerfile") }}
{% endif %}
