name: Test & Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
 

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks
    runs-on: {{ runner_os | default(value="ubuntu-24.04") }}
    timeout-minutes: {{ timeout_minutes | default(value=20) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618f36085b0efc47a31fe5020 # v2
        with:
          bun-version: {{ bun_version | default(value="1.4.4") }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format and lint with Biome
        uses: mongolyy/reviewdog-action-biome@c49bee54c1f87e4be32446ae3deca3a186b88a3a # v2.11.2
        with:
          reporter: github-check
          fail_on_error: true
          biome_flags: {{ formatter_flags | default(value=".") }}

{% if lint_command | default(value="") != "" %}
      - name: Additional lint
        run: {{ lint_command }}
{% endif %}
{% if typecheck_command | default(value="") != "" %}
      - name: Type check
        run: {{ typecheck_command }}
{% endif %}
{% if test_command | default(value="") != "" %}
      - name: Test
        run: {{ test_command }}
{% endif %}
{% if verify_command | default(value="") != "" %}
      - name: Verify
        run: {{ verify_command }}
{% endif %}
{% if build_command | default(value="") != "" %}
      - name: Build
        run: {{ build_command }}
{% endif %}
