name: Test & Build

on: [push, pull_request]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks
    runs-on: {{ runner_os | default(value="ubuntu-24.04") }}
    timeout-minutes: {{ timeout_minutes | default(value=20) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

{% if package_manager | default(value="bun") == "bun" %}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421818 # v2
        with:
          bun-version: {{ bun_version | default(value="1.4.4") }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
{% else %}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: {{ node_version | default(value=24) }}
          cache: npm
      - name: Install dependencies
        run: npm ci
{% endif %}

{% if check_command | default(value="") != "" %}
      - name: Check formatting and lint
        run: {{ check_command }}
{% endif %}
{% if typecheck_command | default(value="") != "" %}
      - name: Type check
        run: {{ typecheck_command }}
{% endif %}
{% if test_command | default(value="") != "" %}
      - name: Test
        run: {{ test_command }}
{% endif %}
{% if verify_command | default(value="") != "" %}
      - name: Verify
        run: {{ verify_command }}
{% endif %}
{% if build_command | default(value="") != "" %}
      - name: Build
        run: {{ build_command }}
{% endif %}
