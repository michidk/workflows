name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ "{{ github.workflow }}" }}-${{ "{{ github.event.pull_request.number || github.ref }}" }}
  cancel-in-progress: true

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  DO_NOT_TRACK: '1'

jobs:
  checks:
    name: Format, lint, types, licenses, and unit tests
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting, lint, types, and license notices
        run: bun run check
      - name: Check Expo dependency compatibility
        run: bunx expo install --check
      - name: Test book models, commands, storage, and drafts
        run: bun run test

  web:
    name: Web journeys, Storybook, and phone preview
    needs: checks
    runs-on: ubicloud-standard-2
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: bunx playwright install --with-deps chromium
      - name: Export offline web app
        run: bun run export:web
      - name: Test offline app journeys
        run: bun run test:e2e
      - name: Build web Storybook
        run: bun run storybook:build
      - name: Test rendered Storybook canvases
        run: bun run test:storybook
      - name: Build phone preview
        run: bun run preview:build
      - name: Test phone preview
        run: bun run test:preview
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-failure-traces
          path: |
            .codex/e2e-output
            .codex/storybook-output
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  native:
    name: Native bundles (${{ "{{ matrix.platform }}" }})
    needs: checks
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Export app bundle
        run: bunx expo export --platform ${{ "{{ matrix.platform }}" }} --output-dir dist-native
