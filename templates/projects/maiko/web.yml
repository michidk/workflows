name: Build browser distribution
on:
  workflow_call:
    inputs:
      pages_artifact:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.90.0'
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: web
      - run: bun install --frozen-lockfile
      - run: bun test web
      - name: Install matching WebAssembly binding generator
        run: |
          version=$(cargo metadata --locked --format-version 1 | jq -er '[.packages[] | select(.name == "wasm-bindgen") | .version] | unique | if length == 1 then .[0] else error("ambiguous wasm-bindgen version") end')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build site and verify runtime kit checksums
        run: bun run build
      - name: Archive browser distribution
        run: tar -czf maiko-browser.tar.gz -C web/dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser
          path: maiko-browser.tar.gz
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: inputs.pages_artifact
        with:
          path: web/dist
